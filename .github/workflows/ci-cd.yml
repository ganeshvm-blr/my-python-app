name: Flask CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: docker build -t flask-app-test .

    - name: Run container
      run: docker run -d -p 5000:5000 --name flask-container flask-app-test

    - name: Wait for app to start
      run: sleep 5

    - name: Test app with curl
      run: curl http://localhost:5000

    - name: Stop container
      run: docker stop flask-container
